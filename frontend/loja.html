<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja - PromoShop</title>
    <style>
        /* keep layout minimal, reuse site styles */
        body{font-family:Arial, sans-serif;background:#f5f5f5;padding:20px}
        .container{max-width:900px;margin:0 auto;background:#fff;padding:24px;border-radius:8px}
        label{display:block;margin-bottom:10px;font-weight:700}
        input,textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;margin-top:6px}
        button{padding:10px 16px;background:#007bff;color:#fff;border:none;border-radius:6px;cursor:pointer}
        .top-links{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    </style>
</head>
<body>
    <div class="container">
        <div class="top-links">
            <h1>Loja — PromoShop</h1>
            <div><a href="cliente.html">Abrir cliente</a></div>
        </div>

        <p>Cadastre promoções, informe o e-mail de contato da loja e cole a chave privada (PKCS8 PEM) para assinar.</p>

        <label>ID da Promoção
            <input id="inputPromoIdLoja" placeholder="ex: promo-1">
        </label>
        <label>Título
            <input id="inputPromoTituloLoja" placeholder="ex: Desconto 50%">
        </label>
        <label>Categoria
            <input id="inputPromoCategoriaLoja" placeholder="ex: Eletrônicos">
        </label>
        <label>Preço
            <input id="inputPromoPrecoLoja" type="number" step="0.01" min="0" placeholder="99.99">
        </label>
        <div style="margin-top:12px">
            <button id="btnRegistrarLoja">Registrar promoção</button>
        </div>

        <div id="notifications" style="margin-top:18px">Nenhuma notificação ainda.</div>
    </div>

    <script src="loja.js"></script>
</body>
</html>
